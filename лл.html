<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нутрия</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    transition: background 0.5s;
  }

  h1 {
    font-size: clamp(3rem, 12vw, 9rem);
    font-weight: 900;
    letter-spacing: 0.05em;
    background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradient 5s ease infinite, float 4s ease-in-out infinite;
    text-shadow: 0 0 60px rgba(255, 107, 107, 0.3);
    user-select: none;
  }

  @keyframes gradient {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  .play-btn {
    padding: 18px 48px;
    font-size: 1.3rem;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .play-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 15px 40px rgba(255, 107, 107, 0.6);
  }

  .play-btn:active { transform: scale(0.97); }

  /* ===== Игровое поле ===== */
  #game {
    position: fixed;
    inset: 0;
    display: none;
    background: linear-gradient(135deg, #0b3d2e, #145a32);
    cursor: crosshair;
    z-index: 10;
  }

  #game.active { display: block; }

  .hud {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    font-size: 1.4rem;
    font-weight: 700;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    pointer-events: none;
  }

  .exit-btn {
    pointer-events: auto;
    padding: 10px 24px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 30px;
    cursor: pointer;
    backdrop-filter: blur(5px);
  }

  .exit-btn:hover { background: rgba(255,255,255,0.3); }

  .nutria {
    position: absolute;
    font-size: 3.5rem;
    cursor: pointer;
    transition: transform 0.1s;
    user-select: none;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
    animation: pop 0.25s ease-out;
  }

  .nutria:hover { transform: scale(1.15); }

  @keyframes pop {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }

  .pop-score {
    position: absolute;
    color: #feca57;
    font-weight: 900;
    font-size: 1.6rem;
    pointer-events: none;
    animation: rise 0.8s ease-out forwards;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }

  @keyframes rise {
    to { transform: translateY(-60px); opacity: 0; }
  }

  /* ===== Экран конца игры ===== */
  .gameover {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(6px);
    color: #fff;
    z-index: 20;
  }

  .gameover.show { display: flex; }

  .gameover h2 { font-size: 3rem; }

  .gameover p { font-size: 1.6rem; }

  .gameover button {
    padding: 15px 40px;
    font-size: 1.2rem;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .gameover button:hover { transform: scale(1.06); }
</style>
</head>
<body>

  <h1>Нутрия</h1>
  <button class="play-btn" id="playBtn">🎮 Поймай нутрию</button>

  <div id="game">
    <div class="hud">
      <span>Счёт: <span id="score">0</span></span>
      <span>Время: <span id="time">30</span>с</span>
      <button class="exit-btn" id="exitBtn">Выйти</button>
    </div>
    <div class="gameover" id="gameover">
      <h2>Время вышло!</h2>
      <p>Поймано нутрий: <span id="finalScore">0</span></p>
      <button id="restartBtn">Играть снова</button>
    </div>
  </div>

<script>
  const playBtn   = document.getElementById('playBtn');
  const exitBtn   = document.getElementById('exitBtn');
  const restartBtn= document.getElementById('restartBtn');
  const gameEl    = document.getElementById('game');
  const scoreEl   = document.getElementById('score');
  const timeEl    = document.getElementById('time');
  const gameover  = document.getElementById('gameover');
  const finalScore= document.getElementById('finalScore');

  const EMOJIS = ['🦫', '🐹', '🦦'];
  const GAME_TIME = 30;

  let score = 0;
  let timeLeft = GAME_TIME;
  let spawnTimer = null;
  let countdownTimer = null;
  let activeNutria = null;
  let playing = false;

  function startGame() {
    playing = true;
    score = 0;
    timeLeft = GAME_TIME;
    scoreEl.textContent = '0';
    timeEl.textContent = GAME_TIME;
    gameover.classList.remove('show');
    gameEl.classList.add('active');
    document.body.style.overflow = 'hidden';

    clearInterval(spawnTimer);
    clearInterval(countdownTimer);

    spawnTimer = setInterval(spawnNutria, 700);
    countdownTimer = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);

    spawnNutria();
  }

  function spawnNutria() {
    if (!playing) return;

    // убираем предыдущую, если её не успели поймать
    if (activeNutria) activeNutria.remove();

    const nutria = document.createElement('div');
    nutria.className = 'nutria';
    nutria.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

    const padding = 60;
    const x = Math.random() * (window.innerWidth - padding * 2) + padding;
    const y = Math.random() * (window.innerHeight - padding * 2) + padding;
    nutria.style.left = x + 'px';
    nutria.style.top  = y + 'px';

    nutria.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      catchNutria(nutria, x, y);
    });

    gameEl.appendChild(nutria);
    activeNutria = nutria;
  }

  function catchNutria(el, x, y) {
    if (!playing) return;
    score++;
    scoreEl.textContent = score;
    el.remove();
    if (el === activeNutria) activeNutria = null;
    showPopup(x, y);
  }

  function showPopup(x, y) {
    const pop = document.createElement('div');
    pop.className = 'pop-score';
    pop.textContent = '+1';
    pop.style.left = x + 'px';
    pop.style.top  = y + 'px';
    gameEl.appendChild(pop);
    setTimeout(() => pop.remove(), 800);
  }

  function endGame() {
    playing = false;
    clearInterval(spawnTimer);
    clearInterval(countdownTimer);
    if (activeNutria) { activeNutria.remove(); activeNutria = null; }
    finalScore.textContent = score;
    gameover.classList.add('show');
  }

  function exitGame() {
    playing = false;
    clearInterval(spawnTimer);
    clearInterval(countdownTimer);
    if (activeNutria) { activeNutria.remove(); activeNutria = null; }
    gameover.classList.remove('show');
    gameEl.classList.remove('active');
    document.body.style.overflow = '';
  }

  playBtn.addEventListener('click', startGame);
  exitBtn.addEventListener('click', exitGame);
  restartBtn.addEventListener('click', startGame);
</script>
</body>
</html>
